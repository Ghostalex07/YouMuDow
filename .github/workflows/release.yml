name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Type check
        run: PYTHONPATH=src mypy src/

      - name: Tests
        run: xvfb-run -a pytest tests/ --tb=short

  build-linux:
    name: Build Linux
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Package
        run: python scripts/package.py --version ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouMuDow-${{ github.ref_name }}-linux
          path: dist/YouMuDow-${{ github.ref_name }}-linux.zip

  build-windows:
    name: Build Windows
    needs: [validate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Package
        run: python scripts/package.py --version ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouMuDow-${{ github.ref_name }}-windows
          path: dist/YouMuDow-${{ github.ref_name }}-windows.zip

  build-macos:
    name: Build macOS
    needs: [validate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Package
        run: python scripts/package.py --version ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouMuDow-${{ github.ref_name }}-darwin
          path: dist/YouMuDow-${{ github.ref_name }}-darwin.zip

  release:
    name: GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifacts
        run: |
          mkdir -p assets
          find dist/ -name "*.zip" -exec mv {} assets/ \;

      - name: Generate SHA256 checksums
        run: |
          cd assets && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: YouMuDow ${{ github.ref_name }}
          body: |
            ## What's New

            ${{ steps.changelog.outputs.notes }}

            ## Downloads

            | Platform | File | SHA256 |
            |----------|------|--------|
            | Linux | `YouMuDow-${{ github.ref_name }}-linux.zip` | see `SHA256SUMS` |
            | Windows | `YouMuDow-${{ github.ref_name }}-windows.zip` | see `SHA256SUMS` |
            | macOS | `YouMuDow-${{ github.ref_name }}-darwin.zip` | see `SHA256SUMS` |

            **Requirements:** [ffmpeg](https://ffmpeg.org/download.html) and [yt-dlp](https://github.com/yt-dlp/yt-dlp) must be installed separately.
          files: |
            assets/YouMuDow-${{ github.ref_name }}-linux.zip
            assets/YouMuDow-${{ github.ref_name }}-windows.zip
            assets/YouMuDow-${{ github.ref_name }}-darwin.zip
            assets/SHA256SUMS
          draft: false
          prerelease: false
