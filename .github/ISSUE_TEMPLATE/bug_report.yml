name: Bug Report
description: Report a bug in YouMuDow
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open YouMuDow
        2. Paste URL '...'
        3. Click Download
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: YouMuDow Version
      description: "Run `youmudow --version` or check the About dialog."
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      description: "Output of `python --version`."
      placeholder: "3.12"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: If applicable, paste relevant log output from the Log Terminal or console.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem (yt-dlp version, ffmpeg installed, etc.).
