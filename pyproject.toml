[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youmudow"
version = "1.2.0"
description = "Music & Video Downloader - A modern desktop application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "YouMuDow"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "yt-dlp>=2024.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "pyinstaller==6.11.1",
    "ruff==0.16.1",
    "mypy==2.3.0",
]

[project.scripts]
youmudow = "youmudow.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["youmudow"]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 70
skip_covered = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "def __repr__",
]

[tool.mypy]
python_version = "3.10"
files = ["src/youmudow"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# The tkinter UI layer is deliberately dynamic (widgets access private
# attributes of the main window); strict typing there adds noise without value.
module = "youmudow.ui.*"
ignore_errors = true
